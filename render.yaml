services:
  - type: web
    name: graider
    runtime: image
    plan: free
    region: ohio
    image:
      url: docker.io/saumyaj1/graider:latest
    healthCheckPath: /health/
    maxShutdownDelaySeconds: 120
    envVars:
      - key: DJANGO_DEBUG
        value: 'false'
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: ''
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: ''
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: ''
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: ''
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-2
      - key: NEON_STORAGE_BUCKET
        value: uploads
      - key: GRAIDER_AI_JOBS_ENABLED
        value: 'true'
      - key: GRAIDER_AI_CONCURRENCY
        value: '10'
      - key: GRAIDER_AI_STUDENT_CONCURRENCY
        value: '10'
      - key: GRAIDER_AI_SCAN_SECONDS
        value: '2'
      - key: GRAIDER_USER_AI_REQUESTS_PER_MINUTE
        value: '120'
      - key: GRAIDER_AI_METRICS
        value: 'false'
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_QUESTION_MODEL
        value: gpt-6-luna
      - key: OPENAI_ARTIFACT_MODEL
        value: gpt-6-luna
      - key: OPENAI_MAPPING_MODEL
        value: gpt-6-luna
      - key: OPENAI_GRADING_MODEL
        value: gpt-6-luna
      - key: OPENAI_QUESTION_REASONING_EFFORT
        value: medium
      - key: OPENAI_QUESTION_REPAIR_REASONING_EFFORT
        value: low
      - key: OPENAI_REFERENCE_REASONING_EFFORT
        value: medium
      - key: OPENAI_RUBRIC_REASONING_EFFORT
        value: medium
      - key: OPENAI_MAPPING_REASONING_EFFORT
        value: low
      - key: OPENAI_GRADING_REASONING_EFFORT
        value: medium
      - key: OPENAI_TIMEOUT_SECONDS
        value: '60'
      - key: GUNICORN_WORKERS
        value: '1'
      - key: GUNICORN_THREADS
        value: '4'
      - key: GUNICORN_TIMEOUT_SECONDS
        value: '120'
      - key: GUNICORN_GRACEFUL_TIMEOUT_SECONDS
        value: '120'
