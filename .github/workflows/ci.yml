name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: graider
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: graider_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U graider -d graider_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: 'true'
      DJANGO_SECRET_KEY: ci-only-secret-a1B2c3D4e5F6g7H8i9J0kLmNoPqRsTuVwXyZ123456789
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: postgresql://graider:ci-only-password@127.0.0.1:5432/graider_ci
      AWS_ENDPOINT_URL_S3: ''
      AWS_ACCESS_KEY_ID: ''
      AWS_SECRET_ACCESS_KEY: ''
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
            backend/requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m pip install -r backend/requirements.txt -c backend/requirements.lock -r backend/requirements-dev.txt
          python -m pip check
          npm ci
          npm ci --prefix frontend
      - name: Repository lint and formatting
        run: make check RUFF=ruff SHELLCHECK=shellcheck
      - name: Frontend production build
        run: npm run build --prefix frontend
      - name: Backend tests and schema consistency
        working-directory: backend
        run: |
          python manage.py test --noinput
          python manage.py makemigrations --check --dry-run
      - name: Collect production assets and check settings
        env:
          DJANGO_DEBUG: 'false'
          FRONTEND_URL: ''
          DJANGO_CORS_ALLOWED_ORIGINS: ''
          DJANGO_CSRF_TRUSTED_ORIGINS: ''
          AWS_ENDPOINT_URL_S3: https://storage.example.invalid
          AWS_ACCESS_KEY_ID: ci-only-key
          AWS_SECRET_ACCESS_KEY: ci-only-key
        run: |
          python backend/manage.py collectstatic --noinput
          python backend/manage.py check --deploy --fail-level ERROR
      - name: Production server and delayed bulk grading
        run: python scripts/production_smoke.py
      - name: Build production image
        run: docker build --tag graider:ci .
      - name: Check container startup and built assets
        env:
          DJANGO_DEBUG: 'false'
          AWS_ENDPOINT_URL_S3: https://storage.example.invalid
          AWS_ACCESS_KEY_ID: ci-only-key
          AWS_SECRET_ACCESS_KEY: ci-only-key
        run: |
          docker run --detach --name graider-ci --network host \
            --env DATABASE_URL --env DJANGO_DEBUG --env DJANGO_SECRET_KEY \
            --env DJANGO_ALLOWED_HOSTS --env AWS_ENDPOINT_URL_S3 \
            --env AWS_ACCESS_KEY_ID --env AWS_SECRET_ACCESS_KEY \
            --env FRONTEND_URL= --env DJANGO_CORS_ALLOWED_ORIGINS= \
            --env DJANGO_CSRF_TRUSTED_ORIGINS= --env OPENAI_API_KEY= graider:ci
          curl --fail --retry 40 --retry-delay 1 --retry-connrefused \
            --header 'X-Forwarded-Proto: https' http://127.0.0.1:10000/health/
          curl --fail --header 'X-Forwarded-Proto: https' \
            http://127.0.0.1:10000/assignments/123/questions
          docker exec graider-ci sh -c \
            'test ! -f /app/.env && test ! -f /app/backend/db.sqlite3 && test -f /app/backend/staticfiles/staticfiles.json'
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs graider-ci 2>/dev/null || true
          docker rm --force graider-ci 2>/dev/null || true
