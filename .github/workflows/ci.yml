name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/production-deployment]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  queue: max

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: graider
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: graider_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U graider -d graider_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: 'true'
      DJANGO_SECRET_KEY: ci-only-secret-a1B2c3D4e5F6g7H8i9J0kLmNoPqRsTuVwXyZ123456789
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: postgresql://graider:ci-only-password@127.0.0.1:5432/graider_ci
      AWS_ENDPOINT_URL_S3: ''
      AWS_ACCESS_KEY_ID: ''
      AWS_SECRET_ACCESS_KEY: ''
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
            backend/requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m pip install -r backend/requirements.txt -c backend/requirements.lock -r backend/requirements-dev.txt
          python -m pip check
          npm ci
          npm ci --prefix frontend
      - name: Repository lint and formatting
        run: make check RUFF=ruff SHELLCHECK=shellcheck
      - name: Frontend production build
        run: npm run build --prefix frontend
      - name: Backend tests and schema consistency
        working-directory: backend
        run: |
          python manage.py test --noinput
          python manage.py makemigrations --check --dry-run
      - name: Collect production assets and check settings
        env:
          DJANGO_DEBUG: 'false'
          FRONTEND_URL: ''
          DJANGO_CORS_ALLOWED_ORIGINS: ''
          DJANGO_CSRF_TRUSTED_ORIGINS: ''
          AWS_ENDPOINT_URL_S3: https://storage.example.invalid
          AWS_ACCESS_KEY_ID: ci-only-key
          AWS_SECRET_ACCESS_KEY: ci-only-key
        run: |
          python backend/manage.py collectstatic --noinput
          python backend/manage.py check --deploy --fail-level ERROR
      - name: Production server and delayed bulk grading
        run: python scripts/production_smoke.py
      - name: Build production image
        run: docker build --tag graider:ci .
      - name: Check container startup and built assets
        env:
          DJANGO_DEBUG: 'false'
          AWS_ENDPOINT_URL_S3: https://storage.example.invalid
          AWS_ACCESS_KEY_ID: ci-only-key
          AWS_SECRET_ACCESS_KEY: ci-only-key
        run: |
          docker run --detach --name graider-ci --network host \
            --env DATABASE_URL --env DJANGO_DEBUG --env DJANGO_SECRET_KEY \
            --env DJANGO_ALLOWED_HOSTS --env AWS_ENDPOINT_URL_S3 \
            --env AWS_ACCESS_KEY_ID --env AWS_SECRET_ACCESS_KEY \
            --env FRONTEND_URL= --env DJANGO_CORS_ALLOWED_ORIGINS= \
            --env DJANGO_CSRF_TRUSTED_ORIGINS= --env OPENAI_API_KEY= graider:ci
          curl --fail --retry 40 --retry-delay 1 --retry-all-errors \
            --header 'X-Forwarded-Proto: https' http://127.0.0.1:10000/health/
          curl --fail --header 'X-Forwarded-Proto: https' \
            http://127.0.0.1:10000/assignments/123/questions
          docker exec graider-ci sh -c \
            'test ! -f /app/.env && test ! -f /app/backend/db.sqlite3 && test -f /app/backend/staticfiles/staticfiles.json'
      - name: Check Docker quickstart and persistent local data
        run: |
          cp .env.example .env
          docker tag graider:ci saumyaj1/graider:ci
          GRAIDER_IMAGE_TAG=ci docker compose --project-name graider-local up --detach --pull never
          curl --fail --retry 40 --retry-delay 1 --retry-all-errors http://127.0.0.1:8000/health/
          docker compose --project-name graider-local exec --no-TTY graider \
            python manage.py shell -c 'from django.contrib.auth import get_user_model; from django.core.files.storage import default_storage; from django.core.files.base import ContentFile; get_user_model().objects.create_user(email="persistence@example.com", password="LocalTest123!"); default_storage.save("persistence.txt", ContentFile(b"persistent upload"))'
          docker compose --project-name graider-local down
          GRAIDER_IMAGE_TAG=ci docker compose --project-name graider-local up --detach --pull never
          curl --fail --retry 40 --retry-delay 1 --retry-all-errors http://127.0.0.1:8000/health/
          docker compose --project-name graider-local exec --no-TTY graider \
            python manage.py shell -c 'from django.contrib.auth import get_user_model; from django.core.files.storage import default_storage; assert get_user_model().objects.filter(email="persistence@example.com").exists(); assert default_storage.open("persistence.txt").read() == b"persistent upload"'
      - name: Container logs and cleanup
        if: always()
        run: |
          docker compose --project-name graider-local logs 2>/dev/null || true
          docker compose --project-name graider-local down --volumes 2>/dev/null || true
          docker logs graider-ci 2>/dev/null || true
          docker rm --force graider-ci 2>/dev/null || true

  publish-image:
    needs: verify
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/production-deployment')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      current: ${{ steps.release.outputs.current }}
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Docker Hub configuration
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo '::error::Set the DOCKERHUB_USERNAME repository variable and DOCKERHUB_TOKEN repository secret.'
            exit 1
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/graider:sha-${{ github.sha }}
            ${{ github.ref == 'refs/heads/feat/production-deployment' && format('{0}/graider:preview', vars.DOCKERHUB_USERNAME) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Promote the current main image to latest
        if: github.ref == 'refs/heads/main'
        id: release
        run: |
          current_main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$GITHUB_SHA" != "$current_main" ]; then
            echo 'A newer merge is queued; this image remains available under its commit tag.'
            echo 'current=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docker buildx imagetools create \
            --tag "$DOCKERHUB_USERNAME/graider:latest" \
            "$DOCKERHUB_USERNAME/graider:sha-$GITHUB_SHA"
          echo 'current=true' >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish-image
    if: needs.publish-image.outputs.current == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - name: Report pending Render setup
        if: env.RENDER_DEPLOY_HOOK == ''
        run: echo '::notice::Image published. Set RENDER_DEPLOY_HOOK to enable automatic Render deployment.'
      - name: Trigger Render with the published commit image
        if: env.RENDER_DEPLOY_HOOK != ''
        env:
          IMAGE_URL: docker.io/${{ vars.DOCKERHUB_USERNAME }}/graider:sha-${{ github.sha }}
        run: |
          curl --fail --silent --show-error --connect-timeout 10 --max-time 60 \
            --request POST --get --data-urlencode "imgURL=$IMAGE_URL" \
            --output /dev/null "$RENDER_DEPLOY_HOOK"
